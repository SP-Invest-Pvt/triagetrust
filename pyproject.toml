[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagetrust"
version = "0.1.0"
description = "Evidence-based governance for AI triage of security findings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
triagetrust = "triagetrust.cli:main"

[tool.setuptools.packages.find]
include = ["triagetrust*"]
