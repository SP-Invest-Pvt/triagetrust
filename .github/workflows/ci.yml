name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: Cache OWASP Benchmark download
        uses: actions/cache@v6
        with:
          path: data/
          key: owasp-benchmark-${{ hashFiles('scripts/fetch_benchmark.sh') }}
      - run: ./scripts/run_all.sh
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: scorecard
          path: results/
