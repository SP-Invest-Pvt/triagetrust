name: llm-eval
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model (blank = gemini-3.8-flash)"
        required: false
        default: ""
  pull_request:

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # gemini-2.5-flash (the code default) is closed to new API users; pin a current flash model.
      MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore LLM response cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: llm-cache-
      - name: List available Gemini flash models
        if: env.GEMINI_API_KEY != ''
        run: |
          curl -sf -H "x-goog-api-key: $GEMINI_API_KEY"             "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000"             | python -c "import json,sys; [print(m['name'].split('/')[-1]) for m in json.load(sys.stdin).get('models',[]) if 'flash' in m['name'] and 'generateContent' in m.get('supportedGenerationMethods',[])]"             || echo "Could not list models"
      - name: Run evaluation with Gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=LLM run skipped::GEMINI_API_KEY secret is not set. Add it with: gh secret set GEMINI_API_KEY -R ${{ github.repository }}"
            echo "GEMINI_API_KEY is not set: skipping the LLM evaluation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Model: $MODEL"
          PROVIDER=gemini ./scripts/run_all.sh
      - name: Save LLM response cache
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload results
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: results/
          if-no-files-found: warn
